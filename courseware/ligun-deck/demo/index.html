<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校园寻宝｜反例与修正</title><link rel="stylesheet" href="../workbook/workbook.css"><style>
main{grid-template-columns:minmax(280px,560px) minmax(280px,1fr)}main>section{min-width:0}#map{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;padding:10px;background:#10293f}#map div{min-width:0;aspect-ratio:1;display:grid;place-items:center;font-size:22px;font-weight:800;background:#fff8e7;color:#162b3a;border:3px solid #a5c9b7}#map .wall{background:#416174;color:white}#map .player{background:#2154d7;color:white}#map .exit{background:#63d7b0}nav{margin:14px 0}#bag,#log{padding:15px;border:3px solid #416174;background:#fffdf7}.failed{color:#a22922}.passed{color:#195c4c}#checks li{padding:7px}@media(max-width:780px){main{grid-template-columns:1fr}}@media print{header,main{display:block}}
</style><link rel="icon" href="../favicon.svg" type="image/svg+xml"></head><body><header><small>预设课堂示范 · 不是学生 AI 的生成结果</small><h1>校园寻宝：重复线索能算三条吗？</h1><label for="version">对比两个版本</label><select id="version"><option value="broken">首版：故意留下重复计数错误</option><option value="fixed">修正版：不同编号只算一次</option></select></header><main><section><div id="map" aria-label="六乘六虚构校园地图"></div><nav aria-label="玩家方向"><button data-move="up">↑ 上</button><button data-move="left">← 左</button><button data-move="down">↓ 下</button><button data-move="right">→ 右</button></nav><button id="reset">从头开始</button><p>入口在左上；出口在右下。移动到 A／B／C 自动拾取。墙不能穿过。键盘方向键或点按均可操作。</p></section><section><h2>我的背包</h2><div id="bag"></div><p id="log" role="status" aria-live="polite"></p><button id="replay-abb">重放 A、B、B：对比两版</button><div id="replay-result" role="status" aria-live="polite"></div><p>从空背包开始，两版使用完全相同输入。要求不变：集齐 A、B、C，到出口才能赢。</p><button id="check">运行同一组验收用例</button><ul id="checks" aria-live="polite"></ul><p>检查会在独立的小测试里运行，不改变你的当前位置。首版故意失败；修正版也要用相同输入再检查。</p></section></main><script type="module" src="demo.js"></script></body></html>
