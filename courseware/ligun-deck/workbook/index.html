<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的主棍与子棍｜模板工作台</title><link rel="stylesheet" href="workbook.css"><link rel="icon" href="../favicon.svg" type="image/svg+xml"></head><body>
<header><small>P2 · 立棍模板</small><h1>把我的游戏说清楚</h1><p>选模板 → 修改为自己的内容 → 复制到自选 AI。这里不调用 AI，也不上传或云端保存。</p></header>
<main><aside><label for="template">选择主棍／子棍</label><select id="template"></select><button id="add">＋ 新建我的模块子棍</button><p>校园寻宝是示例，不代表你的游戏必须有六个模块。新增子棍可自行命名。</p><a href="../templates/templates.zip" download>下载原始 Markdown 模板包</a></aside>
<section class="editor"><label for="title">这份文档的名称</label><input id="title" maxlength="120"><label for="text">正文（可直接修改 Markdown）</label><textarea id="text" spellcheck="false"></textarea><p id="status" role="status" aria-live="polite">先修改占位内容，再执行；不要把未知项当成已确认。</p><nav aria-label="复制与下载"><button id="copy" class="primary">复制当前整份正文</button><button id="download">下载当前 Markdown</button><button id="download-all">下载全部当前文档</button><button id="print">打印当前文档</button></nav><p class="notice">每份子棍可单独复制。编辑暂存在本页面内存中；切换模板不丢失，关闭／刷新会丢失。请先下载备份，不要放密码、密钥或真实隐私。</p></section></main><pre id="print-content"></pre>
<script src="catalog.js"></script><script src="workbook.js"></script></body></html>
