<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>模块思维｜MINI硅谷</title>
  <link rel="stylesheet" href="deck.css">
</head>
<body>
  <main class="viewport" aria-live="polite">
    <div id="deck" class="deck-stage"></div>
  </main>
  <nav class="audience-controls" aria-label="课件控制">
    <button type="button" id="prev" aria-label="上一步">←</button>
    <button type="button" id="advance" class="primary" aria-label="揭示或下一页">继续</button>
    <button type="button" id="next" aria-label="下一页">→</button>
    <button type="button" id="fullscreen" aria-label="全屏">⛶</button>
  </nav>
  <div id="audience-status" class="audience-status">AUDIENCE · LOCAL</div>
  <script src="deck-data.js"></script>
  <script src="deck-runtime.js"></script>
</body>
</html>
