# Mini Silicon Valley eight-seat live-run console.
# Place this block before the generic `location ^~ /msv/` static block.
# TLS terminates at Cloudflare; the gateway strips `/msv/alpha/` before
# forwarding to the LAN console.  The console itself never exposes controller
# bootstrap, script, or control routes and projects state to the claimed seat.
location = /msv/alpha {
    return 308 /msv/alpha/$is_args$args;
}

location ^~ /msv/alpha/ {
    limit_req zone=msv_alpha_write_edge burst=16 nodelay;
    limit_req_status 429;
    client_max_body_size 12k;
    rewrite ^/msv/alpha/(.*)$ /$1 break;
    proxy_pass http://192.168.50.243:18766;
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $real_client_ip;
    proxy_set_header X-Forwarded-For $real_client_ip;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Prefix /msv/alpha;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    # Replace, rather than duplicate, the service's defence-in-depth headers at
    # the public edge so browsers receive one unambiguous policy.
    proxy_hide_header Cache-Control;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
    proxy_buffering off;
    # Seat capabilities live in URL fragments and request headers.  Disable
    # request logging here as a second layer against accidental metadata leaks.
    access_log off;

    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-MSV-Alpha-Origin "windows-live-run-console" always;
}
