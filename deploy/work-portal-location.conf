# Mini Silicon Valley root portal and stable human-facing entry aliases.
# Insert before the generic `location ^~ /msv/` static block.
location = /msv {
    return 308 /msv/$is_args$args;
}

location = /msv/ {
    root /srv/msv-site/current;
    try_files /msv/index.html =404;

    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; script-src 'none'; connect-src 'none'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-MSV-Portal "site-map-v1" always;
}

# Stable navigation paths.  The targets remain compatibility implementation
# paths until the dynamic app is rebuilt under its next canonical base path.
location = /msv/world { return 302 /msv/demo/app/$is_args$args; }
location = /msv/world/ { return 302 /msv/demo/app/$is_args$args; }
location = /msv/classroom { return 302 /msv/demo/app/classroom$is_args$args; }
location = /msv/classroom/ { return 302 /msv/demo/app/classroom$is_args$args; }
location = /msv/framework { return 302 /msv/123456.html$is_args$args; }
location = /msv/framework/ { return 302 /msv/123456.html$is_args$args; }
location = /msv/parents { return 302 /msv/qa.html$is_args$args; }
location = /msv/parents/ { return 302 /msv/qa.html$is_args$args; }
location = /msv/workshop { return 302 /msv/launch.html$is_args$args; }
location = /msv/workshop/ { return 302 /msv/launch.html$is_args$args; }

# Account utilities use the same stable, memorable namespace.
location = /msv/login { return 302 /msv/demo/app/auth/login$is_args$args; }
location = /msv/login/ { return 302 /msv/demo/app/auth/login$is_args$args; }
location = /msv/register { return 302 /msv/demo/app/auth/register$is_args$args; }
location = /msv/register/ { return 302 /msv/demo/app/auth/register$is_args$args; }
location = /msv/recover { return 302 /msv/demo/app/auth/recover$is_args$args; }
location = /msv/recover/ { return 302 /msv/demo/app/auth/recover$is_args$args; }
location = /msv/account { return 302 /msv/demo/app/account$is_args$args; }
location = /msv/account/ { return 302 /msv/demo/app/account$is_args$args; }
