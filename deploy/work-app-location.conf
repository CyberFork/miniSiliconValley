# Insert this block before the generic `location ^~ /msv/` block in the
# work-sync Nginx gateway. The Worker listens only on the host loopback; this
# gateway is the sole public path to the loopback-only Worker. Authentication
# happens inside the application with an opaque HttpOnly session cookie.
location = /msv/demo/app {
    return 308 /msv/demo/app/$is_args$args;
}

location = /msv/demo/app/logout {
    return 308 /msv/demo/app/auth/login$is_args$args;
}

location ^~ /msv/demo/app/ {
    limit_req zone=msv_auth_edge burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    rewrite ^/msv/demo/app/(.*)$ /$1 break;
    proxy_pass http://host.docker.internal:18787;
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $real_client_ip;
    proxy_set_header X-Forwarded-For $real_client_ip;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Prefix /msv/demo/app;

    # Never forward caller credentials or accept legacy caller-forged identity
    # headers. The Worker resolves the opaque session cookie against D1.
    proxy_set_header Authorization "";
    proxy_set_header x-msv-authenticated-user-id "";
    proxy_set_header x-msv-authenticated-user-email "";
    proxy_set_header x-msv-authenticated-user-full-name "";
    proxy_set_header x-msv-authenticated-user-full-name-encoding "";

    proxy_read_timeout 65s;
    proxy_send_timeout 65s;
    proxy_buffering off;

    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:; font-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-MSV-App-Origin "work-self-hosted" always;
}
