<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>回声断层｜段柯屹｜路演</title><style>*{box-sizing:border-box}body{margin:0;background:#07101b;color:#fff;font-family:system-ui}main{height:100vh;display:flex;flex-direction:column;align-items:center}img{display:block;width:100%;height:calc(100vh - 52px);object-fit:contain}nav{height:52px;display:flex;align-items:center;justify-content:center;gap:28px}button{font:inherit;padding:7px 22px;color:#172d40;background:#f1c453;border:2px solid white;cursor:pointer}button:disabled{opacity:.5}</style></head><body><main><img id="slide" src="slide-01.jpg" alt="段柯屹《回声断层》路演，第1页"><nav><button id="prev" type="button">← 上一页</button><span id="count" aria-live="polite">1 / 10</span><button id="next" type="button">下一页 →</button></nav></main><script>let n=1;function show(v){n=Math.max(1,Math.min(10,v));document.querySelector('#slide').src='slide-'+String(n).padStart(2,'0')+'.jpg';document.querySelector('#slide').alt='段柯屹《回声断层》路演，第'+n+'页';document.querySelector('#count').textContent=n+' / 10';document.querySelector('#prev').disabled=n===1;document.querySelector('#next').disabled=n===10;}document.querySelector('#prev').onclick=()=>show(n-1);document.querySelector('#next').onclick=()=>show(n+1);document.addEventListener('keydown',e=>{if(['ArrowRight',' ','ArrowDown'].includes(e.key)){e.preventDefault();show(n+1)}if(['ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();show(n-1)}});show(1);</script></body></html>
