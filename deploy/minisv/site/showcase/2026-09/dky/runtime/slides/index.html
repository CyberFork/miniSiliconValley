<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>回声断层｜段柯屹｜路演</title><style>*{box-sizing:border-box}body{margin:0;background:#07101b;color:#fff;font-family:system-ui}main{height:100vh;display:flex;flex-direction:column;align-items:center}img{display:block;width:100%;height:calc(100vh - 52px);object-fit:contain}nav{height:52px;display:flex;align-items:center;justify-content:center;gap:28px}button{font:inherit;padding:7px 22px;color:#172d40;background:#f1c453;border:2px solid white;cursor:pointer}button:disabled{opacity:.5}
/* Appended recording page; original slide content stays intact. */
.video-slide{padding:20px 28px!important;gap:10px;justify-content:flex-start!important;align-items:stretch!important;text-align:center}
.video-slide h2{font-size:30px;margin:0;line-height:1.3;flex:0 0 auto}
.video-slide p{font-size:16px;margin:0;line-height:1.4;flex:0 0 auto}
.video-slide video{display:block;width:100%;min-height:0;flex:1 1 0;object-fit:contain;background:#000;border-radius:8px}
.video-slide[hidden]{display:none!important}
.video-slide{height:calc(100vh - 52px);width:100%;display:flex;flex-direction:column}img[hidden]{display:none}</style></head><body><main><img id="slide" src="slide-01.jpg" alt="段柯屹《回声断层》路演，第1页"><section id="video-page" class="video-slide" hidden><h2>《回声断层》试玩视频</h2><p>点击播放 · 可暂停、调节音量或拖动进度</p><video id="game-demo" controls playsinline preload="none" poster="game-demo.jpg" aria-label="游戏试玩视频"><source src="game-demo.mp4" type="video/mp4">当前浏览器无法播放此视频，请使用支持 MP4 的浏览器。</video></section><nav><button id="prev" type="button">← 上一页</button><span id="count" aria-live="polite">1 / 11</span><button id="next" type="button">下一页 →</button></nav></main><script>let n=1;function show(v){n=Math.max(1,Math.min(11,v));document.querySelector('#slide').hidden=n===11;document.querySelector('#video-page').hidden=n!==11;if(n!==11)document.querySelector('#game-demo').pause();if(n!==11)document.querySelector('#slide').src='slide-'+String(n).padStart(2,'0')+'.jpg';document.querySelector('#slide').alt='段柯屹《回声断层》路演，第'+n+'页';document.querySelector('#count').textContent=n+' / 11';document.querySelector('#prev').disabled=n===1;document.querySelector('#next').disabled=n===11;}document.querySelector('#prev').onclick=()=>show(n-1);document.querySelector('#next').onclick=()=>show(n+1);document.addEventListener('keydown',e=>{if(e.target.closest?.('video'))return;if(['ArrowRight',' ','ArrowDown'].includes(e.key)){e.preventDefault();show(n+1)}if(['ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();show(n-1)}});show(1);document.addEventListener('visibilitychange',()=>{if(document.hidden)document.querySelector('#game-demo').pause();});</script></body></html>
