<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>回声断层｜段柯屹｜路演</title><style>
*{box-sizing:border-box}body{margin:0;background:#07101b;color:#fff;font-family:system-ui}main{height:100vh;display:flex;flex-direction:column;align-items:center}
.page-stage{width:100%;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.slide-canvas{position:relative;width:min(100%,calc((100vh - 52px)*16/9));aspect-ratio:16/9}
#slide{display:block;width:100%;height:100%;object-fit:contain}
/* Keep page 9's original text; place playback over its right-hand media area. */
#video-page{position:absolute;left:51%;top:20%;width:43%;height:43%;background:#000}
#video-page[hidden]{display:none}#game-demo{display:block;width:100%;height:100%;object-fit:contain}
nav{height:52px;flex:none;display:flex;align-items:center;justify-content:center;gap:28px}button{font:inherit;padding:7px 22px;color:#172d40;background:#f1c453;border:2px solid white;cursor:pointer}button:disabled{opacity:.5}
</style></head><body><main><div class="page-stage"><div class="slide-canvas"><img id="slide" src="slide-01.jpg" alt="段柯屹《回声断层》路演，第1页"><section id="video-page" aria-label="第9页游戏试玩视频" hidden><video id="game-demo" controls playsinline preload="none" poster="game-demo.jpg" aria-label="游戏试玩视频"><source src="game-demo.mp4" type="video/mp4">当前浏览器无法播放此视频，请使用支持 MP4 的浏览器。</video></section></div></div><nav><button id="prev" type="button">← 上一页</button><span id="count" aria-live="polite">1 / 10</span><button id="next" type="button">下一页 →</button></nav></main><script>
let n=1;function show(v){n=Math.max(1,Math.min(10,v));document.querySelector('#video-page').hidden=n!==9;if(n!==9)document.querySelector('#game-demo').pause();document.querySelector('#slide').src='slide-'+String(n).padStart(2,'0')+'.jpg';document.querySelector('#slide').alt='段柯屹《回声断层》路演，第'+n+'页';document.querySelector('#count').textContent=n+' / 10';document.querySelector('#prev').disabled=n===1;document.querySelector('#next').disabled=n===10;}
document.querySelector('#prev').onclick=()=>show(n-1);document.querySelector('#next').onclick=()=>show(n+1);document.addEventListener('keydown',e=>{if(e.target.closest?.('video'))return;if(['ArrowRight',' ','ArrowDown'].includes(e.key)){e.preventDefault();show(n+1)}if(['ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();show(n-1)}});show(1);document.addEventListener('visibilitychange',()=>{if(document.hidden)document.querySelector('#game-demo').pause();});</script></body></html>
