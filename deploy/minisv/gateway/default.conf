upstream minisv_app_backend { server host.docker.internal:18787; keepalive 16; }
upstream minisv_qa_backend { server host.docker.internal:18789; keepalive 4; }

server {
    listen 8080;
    server_name www.minisv.vip;
    return 308 https://minisv.vip$request_uri;
}

server {
    listen 8080 default_server;
    server_name minisv.vip _;
    absolute_redirect off;
    port_in_redirect off;
    client_max_body_size 64k;

    # cloudflared forwards the visitor's original scheme. Redirect at our own
    # trust boundary so first-time visitors never receive login or classroom
    # HTML over cleartext, even if the Cloudflare dashboard setting changes.
    if ($http_x_forwarded_proto = "http") {
        return 308 https://minisv.vip$request_uri;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "$minisv_csp" always;
    add_header Permissions-Policy "$minisv_permissions_policy" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "$minisv_frame_options" always;
    add_header X-Robots-Tag "$minisv_robots_header" always;
    add_header X-MiniSV-Origin "hecate" always;
    # Preserve the origin response byte-for-byte. In particular this prevents
    # Cloudflare Web Analytics from injecting a third-party beacon that our
    # deliberately strict CSP would (correctly) reject.
    add_header Cache-Control "$minisv_cache_control" always;

    # nginx's standard mime.types includes .js/.wasm but not ES modules (.mjs).
    # Retain the complete MIME table, then add the missing module extension.
    include /etc/nginx/mime.types;
    types { application/javascript mjs; }

    root /srv/minisv/site;
    sub_filter_once on;
    sub_filter '</body>' '$minisv_courseware_chrome</body>';
    error_page 404 /404.html;

    location = /404.html {
        internal;
        try_files /404.html =404;
    }

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"ok":true,"service":"minisv-gateway","origin":"hecate"}\n';
    }

    location = / {
        try_files /index.html =404;
        expires -1;
    }
    location = /portal.css { try_files $uri =404; expires 1h; }
    location = /portal.js { try_files $uri =404; expires -1; }
    # Standalone public prompt center: exact runtime files only, no course auth change.
    location = /prompts { return 302 /prompts/$is_args$args; }
    location = /prompts/ { try_files /prompts/index.html =404; expires off; }
    location = /prompts/index.html { try_files $uri =404; expires off; }
    location = /prompts/workbook.css { try_files $uri =404; expires off; }
    location = /prompts/workbook.js { try_files $uri =404; expires off; }
    location = /prompts/student-prompt.js { try_files $uri =404; expires off; }
    location = /prompts/student-prompt.txt { try_files $uri =404; expires off; }
    location = /prompts/compose.js { try_files $uri =404; expires off; }
    location = /prompts/manifest.json { try_files $uri =404; expires off; }
    location = /prompts/general { return 302 /prompts/?game=0; }
    location = /prompts/general/ { return 302 /prompts/?game=0; }
    location = /prompts/general/index.html { return 302 /prompts/?game=0; }
    location = /prompts/general/workbook.css { try_files $uri =404; expires off; }
    location = /prompts/general/workbook.js { try_files $uri =404; expires off; }
    location = /prompts/general/student-prompt.js { try_files $uri =404; expires off; }
    location = /prompts/general/student-prompt.txt { try_files $uri =404; expires off; }
    location = /prompts/general/compose.js { try_files $uri =404; expires off; }
    location = /prompts/general/manifest.json { try_files $uri =404; expires off; }
    location ^~ /prompts/ { return 404; }
    location = /courseware/latest/p1/workbook { return 302 /prompts/$is_args$args; }
    location = /courseware/latest/p1/workbook/ { return 302 /prompts/$is_args$args; }
    location = /courseware/latest/p1/workbook/index.html { return 302 /prompts/$is_args$args; }
    location = /courseware/development-mentor-module-thinking/r24/audience/ai-materials/workbook/ { return 302 /prompts/$is_args$args; }
