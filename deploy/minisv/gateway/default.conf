    "/index.html" "index, follow";
    ~^/prompts(?:/|$) "index, follow";
    ~^/(world|framework|parents)(?:/|$) "index, follow";
    ~^/incubator/?(?:index\.html)?$ "index, follow";
    ~^/incubator/projects/?(?:index\.html)?$ "index, follow";
    ~^/incubator/projects/(?:recitation|mistake-notebook)/?(?:index\.html)?$ "index, follow";
