    # separate from the deliberately public T-119 form above, apply the same
    # write throttling as the other classroom mutations, and preserve the
    # exact API path for server-side RBAC and CSRF checks.
    location ^~ /api/homework/ {
        limit_req zone=minisv_platform_write burst=24 nodelay;
        limit_req_status 429;
        client_max_body_size 96k;
        set $app_path $uri;
        include /etc/nginx/minisv/app-proxy.conf;
    }
