map $http_cf_connecting_ip $minisv_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}
map $request_uri $minisv_auth_limit_key {
    default "";
    ~^/api/auth/ $minisv_client_ip;
}
map "$request_method:$request_uri" $minisv_alpha_write_key {
    default "";
    ~^(POST|DELETE):/alpha/api/claims $minisv_client_ip;
}
map "$request_method:$request_uri" $minisv_control_write_key {
    default "";
    ~^POST:/control/api/ $minisv_client_ip;
}
map $request_uri $minisv_qa_key {
    default "";
    =/api/qa $minisv_client_ip;
}
map $request_uri $minisv_csp {
    default "default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:; font-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'";
    ~^/api/ "default-src 'none'; frame-ancestors 'none'";
    ~^/control/api/ "default-src 'none'; frame-ancestors 'none'";
}
limit_req_zone $minisv_auth_limit_key zone=minisv_auth:10m rate=60r/m;
limit_req_zone $minisv_alpha_write_key zone=minisv_alpha_write:10m rate=30r/m;
limit_req_zone $minisv_control_write_key zone=minisv_control_write:10m rate=20r/m;
limit_req_zone $minisv_qa_key zone=minisv_qa:10m rate=6r/m;


upstream minisv_app_backend { server host.docker.internal:18787; keepalive 16; }
upstream minisv_qa_backend { server host.docker.internal:18789; keepalive 4; }
upstream minisv_control_backend { server host.docker.internal:18790; keepalive 4; }
upstream minisv_alpha_backend { server host.docker.internal:18791; keepalive 8; }

server {
    listen 8080;
    server_name www.minisv.vip;
    return 308 https://minisv.vip$request_uri;
}

server {
    listen 8080 default_server;
    server_name minisv.vip _;
    absolute_redirect off;
    port_in_redirect off;
    client_max_body_size 64k;

    # cloudflared forwards the visitor's original scheme. Redirect at our own
    # trust boundary so first-time visitors never receive login or classroom
    # HTML over cleartext, even if the Cloudflare dashboard setting changes.
    if ($http_x_forwarded_proto = "http") {
        return 308 https://minisv.vip$request_uri;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "$minisv_csp" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-MiniSV-Origin "hecate" always;
    # Preserve the origin response byte-for-byte. In particular this prevents
    # Cloudflare Web Analytics from injecting a third-party beacon that our
    # deliberately strict CSP would (correctly) reject.
    add_header Cache-Control "no-transform" always;

    root /srv/minisv/site;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"ok":true,"service":"minisv-gateway","origin":"hecate"}\n';
    }

    location = / {
        try_files /index.html =404;
        expires -1;
    }
    location = /portal.css { try_files $uri =404; expires 1h; }
    location = /portal.js { try_files $uri =404; expires -1; }
    location = /ui-theme.css { try_files $uri =404; expires -1; }
    location = /ui-theme.js { try_files $uri =404; expires -1; }
    location = /site.webmanifest { try_files $uri =404; expires 1h; }
    location = /robots.txt { try_files $uri =404; expires 1h; }
    location = /release.json { try_files $uri =404; expires -1; }
    location = /sitemap.json { try_files $uri =404; expires -1; }

    location ^~ /_next/ {
        try_files $uri =404;
        expires 1y;
    }
    location ^~ /assets/ {
        try_files $uri =404;
        expires 7d;
    }
    location = /favicon.svg { try_files $uri =404; expires 7d; }
    location = /favicon.ico { return 308 /favicon.svg; }
    location = /og.png { try_files $uri =404; expires 7d; }

    location = /world { return 308 /world/$is_args$args; }
    location ^~ /world/ { try_files $uri $uri/ /world/index.html; expires -1; }
    location = /course { return 308 /course/$is_args$args; }
    location ^~ /course/ { try_files $uri $uri/ /course/index.html; expires -1; }
    location = /framework { return 308 /framework/$is_args$args; }
    location ^~ /framework/ { try_files $uri $uri/ /framework/index.html; expires -1; }
    location = /parents { return 308 /parents/$is_args$args; }
    location ^~ /parents/ { try_files $uri $uri/ /parents/index.html; expires -1; }
    location = /workshop { return 308 /workshop/$is_args$args; }
    location ^~ /workshop/ { try_files $uri $uri/ /workshop/index.html; expires -1; }

    # Public eight-seat console. It exposes only capability-scoped seat views.
    location = /alpha { return 308 /alpha/$is_args$args; }
    location ^~ /alpha/ {
        limit_req zone=minisv_alpha_write burst=16 nodelay;
        limit_req_status 429;
        client_max_body_size 12k;
        rewrite ^/alpha/(.*)$ /$1 break;
        proxy_pass http://minisv_alpha_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $minisv_client_ip;
        proxy_set_header X-Forwarded-For $minisv_client_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_connect_timeout 4s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_buffering off;
    }

    # RBAC-protected LIVE RUN controller. The controller itself validates the
    # first-party HttpOnly session and role; Nginx never sees a control token.
    location = /control { return 308 /control/$is_args$args; }
    location ^~ /control/ {
        limit_req zone=minisv_control_write burst=8 nodelay;
        limit_req_status 429;
        # Course packages are declarative JSON and capped again at 512 KiB by
        # the controller.  The ordinary execution endpoint retains 16 KiB.
        client_max_body_size 512k;
        rewrite ^/control/(.*)$ /$1 break;
        proxy_pass http://minisv_control_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $minisv_client_ip;
        proxy_set_header X-Forwarded-For $minisv_client_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        proxy_connect_timeout 4s;
        proxy_read_timeout 70s;
        proxy_send_timeout 70s;
        proxy_buffering off;
    }

    location = /api/qa {
        limit_req zone=minisv_qa burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 12k;
        proxy_pass http://minisv_qa_backend/qa;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $minisv_client_ip;
        proxy_set_header X-Forwarded-For $minisv_client_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 55s;
        proxy_send_timeout 55s;
        proxy_buffering off;
    }

    # Existing compiled classroom runtime, exposed as clean first-party routes.
    # Internal compatibility headers match the build's verified origin policy;
    # response paths/canonicals are rewritten to minisv.vip at the boundary.
    location ~ ^/(classroom|account)(/)?$ {
        set $app_path /$1;
        include /etc/nginx/minisv/app-proxy.conf;
    }
    location ^~ /auth/ {
        set $app_path $uri;
        include /etc/nginx/minisv/app-proxy.conf;
    }
    location ^~ /api/auth/ {
        limit_req zone=minisv_auth burst=20 nodelay;
        limit_req_status 429;
        set $app_path $uri;
        include /etc/nginx/minisv/app-proxy.conf;
    }
    location ^~ /api/classroom/ {
        set $app_path $uri;
        include /etc/nginx/minisv/app-proxy.conf;
    }

    location = /login { return 307 /auth/login$is_args$args; }
    location = /login/ { return 307 /auth/login$is_args$args; }
    location = /register { return 307 /auth/register$is_args$args; }
    location = /register/ { return 307 /auth/register$is_args$args; }
    location = /recover { return 307 /auth/recover$is_args$args; }
    location = /recover/ { return 307 /auth/recover$is_args$args; }

    # Compatibility only: no new page emits these retired implementation URLs.
    location = /demo.html { return 308 /world/$is_args$args; }
    location = /123456.html { return 308 /framework/$is_args$args; }
    location = /qa.html { return 308 /parents/$is_args$args; }
    location = /launch.html { return 308 /workshop/$is_args$args; }
    location = /msv { return 308 /$is_args$args; }
    location ^~ /msv/ { return 308 /$is_args$args; }

    location / { return 404; }
}
