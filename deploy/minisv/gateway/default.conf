# rule at server scope so every route keeps all inherited security headers.
map $request_uri $minisv_cache_control {
    default "no-transform";
    ~^/prompts(?:/|$) "no-store, no-transform";
    ~^/courseware-current "no-store, no-transform";
    ~^/courseware/latest/ "no-store, no-transform";
    ~^/courseware/(product-mentor-foundations|development-mentor-ligun|development-mentor-module-thinking|market-mentor-user-system)/ "private, no-store, no-transform";
