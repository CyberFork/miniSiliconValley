proxy_pass http://minisv_app_backend$app_path$is_args$args;
proxy_http_version 1.1;
proxy_set_header Connection "";
# Classroom is built natively for minisv.vip and the root path.  The loopback
# hop therefore needs no old-domain or /msv compatibility rewrite.
proxy_set_header Host minisv.vip;
proxy_set_header X-Forwarded-Host minisv.vip;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Real-IP $minisv_client_ip;
proxy_set_header X-Forwarded-For $minisv_client_ip;
# Preserve the browser's real Origin so the application same-origin guard can
# reject cross-origin writes. Hard-coding the trusted origin here would turn
# that server-side CSRF check into a no-op.
proxy_set_header Origin $http_origin;
proxy_set_header Authorization "";
proxy_set_header x-msv-authenticated-user-id "";
proxy_set_header x-msv-authenticated-user-email "";
proxy_set_header x-msv-authenticated-user-full-name "";
proxy_set_header x-msv-authenticated-user-full-name-encoding "";
proxy_set_header Accept-Encoding "";
proxy_connect_timeout 5s;
proxy_read_timeout 65s;
proxy_send_timeout 65s;
proxy_buffering off;
sub_filter_once off;
sub_filter_types application/json text/plain text/x-component;
sub_filter '</head>' '<link rel="stylesheet" href="/ui-theme.css?v=20260912-official-wordmark-r5"><script src="/ui-theme.js?v=20260912-official-wordmark-r5"></script></head>';
