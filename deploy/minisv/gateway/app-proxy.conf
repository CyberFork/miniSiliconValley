proxy_pass http://minisv_app_backend$app_path$is_args$args;
proxy_http_version 1.1;
proxy_set_header Connection "";
# The deployed Worker was built for the former prefix. These are origin-only
# compatibility values; the browser receives and calls minisv.vip exclusively.
proxy_set_header Host work.cyberforker.com;
proxy_set_header X-Forwarded-Host work.cyberforker.com;
proxy_set_header X-Forwarded-Prefix /msv/demo/app;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Real-IP $minisv_client_ip;
proxy_set_header X-Forwarded-For $minisv_client_ip;
proxy_set_header Origin https://work.cyberforker.com;
proxy_set_header Authorization "";
proxy_set_header x-msv-authenticated-user-id "";
proxy_set_header x-msv-authenticated-user-email "";
proxy_set_header x-msv-authenticated-user-full-name "";
proxy_set_header x-msv-authenticated-user-full-name-encoding "";
proxy_set_header Accept-Encoding "";
proxy_cookie_path /msv/demo/app /;
proxy_redirect ~^https?://[^/]+/msv/demo/app/(.*)$ /$1;
proxy_redirect /msv/demo/app/ /;
proxy_connect_timeout 5s;
proxy_read_timeout 65s;
proxy_send_timeout 65s;
proxy_buffering off;
sub_filter_once off;
sub_filter_types application/json text/plain text/x-component;
sub_filter '</head>' '<link rel="stylesheet" href="/ui-theme.css?v=20260906-4"><script src="/ui-theme.js?v=20260906-4"></script></head>';
sub_filter 'https://work.cyberforker.com/msv/demo/app/123456' 'https://minisv.vip/framework/';
sub_filter 'https://work.cyberforker.com/msv/demo/app/qa' 'https://minisv.vip/parents/';
sub_filter 'https://work.cyberforker.com/msv/demo/app' 'https://minisv.vip';
sub_filter 'https://work.cyberforker.com/msv' 'https://minisv.vip';
sub_filter '/msv/demo/app/123456' '/framework/';
sub_filter '/msv/demo/app/qa' '/parents/';
sub_filter '/msv/demo/app/classroom' '/classroom';
sub_filter '/msv/demo/app' '';
sub_filter '/msv/123456.html' '/framework/';
sub_filter '/msv/demo.html' '/world/';
sub_filter '/msv/qa.html' '/parents/';
sub_filter '/msv/' '/';
