# Insert this exact location before the generic `location ^~ /msv/` block.
# The static document needs same-origin fetch access to the self-hosted Q&A API;
# the rest of the existing workshop retains its stricter `connect-src 'none'`.
location = /msv/api/qa {
    limit_req zone=msv_qa_edge burst=3 nodelay;
    limit_req_status 429;
    client_max_body_size 12k;

    proxy_pass http://host.docker.internal:18789/qa;
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $real_client_ip;
    proxy_set_header X-Forwarded-For $real_client_ip;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 55s;
    proxy_send_timeout 55s;
    proxy_buffering off;

    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}

location = /msv/qa.html {
    root /srv/msv-site/current;
    try_files $uri =404;

    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:; font-src 'self'; media-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}
