# The first-party account system performs per-identity and per-client
# throttling in D1. This HTTP-context zone is a second, coarse defence against
# request floods before they reach password hashing. An empty key means all
# non-auth classroom traffic (including 3-second polling) is deliberately not
# rate limited by this zone.
map $request_uri $msv_auth_limit_key {
    default "";
    ~^/msv/demo/app/api/auth/ $binary_remote_addr;
}
limit_req_zone $msv_auth_limit_key zone=msv_auth_edge:10m rate=60r/m;

# The public parent Q&A endpoint calls a metered external model. Give it a
# separate, deliberately low edge budget without throttling page assets,
# classroom polling, or other application APIs.
map $request_uri $msv_qa_limit_key {
    default "";
    =/msv/api/qa $real_client_ip;
}
limit_req_zone $msv_qa_limit_key zone=msv_qa_edge:10m rate=6r/m;
