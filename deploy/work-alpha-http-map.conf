# HTTP-context write throttle for the unauthenticated alpha test console.
# Empty keys are not accounted, so 2-second console polling and 900ms seat
# state polling remain unaffected; only seat claim/release/reset mutations are
# throttled at the public edge.
map "$request_method:$request_uri" $msv_alpha_write_limit_key {
    default "";
    ~^(POST|DELETE):/msv/alpha/api/claims $real_client_ip;
}
limit_req_zone $msv_alpha_write_limit_key zone=msv_alpha_write_edge:10m rate=30r/m;
