<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MSV Classroom Seat</title><link rel="icon" href="data:,"><link rel="stylesheet" href="seat.css"><link rel="stylesheet" href="/ui-theme.css?v=20260906-5"><script src="/ui-theme.js?v=20260906-5"></script>
</head>
<body>
<header><div><div class="eyebrow" id="kind">LOADING</div><h1 id="name" aria-live="polite">正在连接课堂…</h1><p class="subidentity" id="subidentity"></p></div><div class="seat" id="seat"></div></header>

<div class="metrics" id="metrics"></div>
<section class="card"><h2 id="factsTitle">我的信息 / 验收证据</h2><ul id="facts"></ul></section>
<section class="card" id="teamworkCard"><h2 id="teamworkTitle">怎么和队友配合</h2><ul id="teamwork"></ul></section>
<section class="card"><h2 id="chipsTitle">当前持有</h2><div class="chips" id="chips"></div></section>
<footer><span id="room">MSV LIVE RUN</span><span id="updated">--:--:--</span></footer>
<script src="seat.js"></script>
